services:
  - type: web
    name: orange-shop
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /api/products
    envVars:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://orange-shop-rrl.pages.dev
