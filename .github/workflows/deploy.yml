name: Deploy to Railway
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Railway
        run: |
          echo "Deploying to Railway..."
          curl -s -X POST https://api.railway.app/v2/deployments             -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}"             -H "Content-Type: application/json"             -d '{"serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}"}' || true
